        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f0f1a;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 16px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .template-name {
            font-size: 16px;
            color: #a5b4fc;
            margin-bottom: 20px;
        }

        .lang-badge {
            display: inline-block;
            background: rgba(99,102,241,0.2);
            color: #a5b4fc;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .prompt-container {
            position: relative;
            background: #12121e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .prompt-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .prompt-text {
            font-size: 14px;
            line-height: 1.7;
            color: #d1d5db;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .copy-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(99,102,241,0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(99,102,241,0.3);
        }

        .copy-btn.copied {
            background: rgba(34,197,94,0.15);
            color: #4ade80;
            border-color: rgba(34,197,94,0.3);
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
        }

        .divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 24px 0;
        }

        .cta-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .cta-subtitle {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 16px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-primary {
            background: #6366f1;
            color: #fff;
        }

        .btn-primary:hover {
            background: #4f46e5;
        }

        .error-msg {
            color: #f87171;
            font-size: 14px;
            margin: 16px 0;
        }

        .hero-tagline {
            color: #9ca3af;
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #6b7280;
        }

        .footer a {
            color: #a5b4fc;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* RTL support for Arabic and Hebrew */
        [dir="rtl"] .prompt-text {
            direction: rtl;
            text-align: right;
        }

        [dir="rtl"] .prompt-label {
            text-align: right;
        }

        [dir="rtl"] .copy-btn {
            right: auto;
            left: 12px;
        }

        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            .buttons { flex-direction: column; }
            .btn { justify-content: center; }
        }
    </style>

        };

        // RTL languages
        const RTL_LANGS = ['AR', 'HE'];

        function getLang(langCode) {
            const code = (langCode || 'EN').toUpperCase().replace('-','_');
            return L[code] || L['EN'];
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderDownloadButtons(t) {
            return `
                <div class="divider"></div>
                <div class="cta-title">${t.getApp}</div>
                <div class="cta-subtitle">${t.subtitle}</div>
                <div class="buttons">
                    <a href="${MAC_URL}" class="btn btn-primary" target="_blank" rel="noopener">
                        ${macSVG} ${t.download}
                    </a>
                </div>
            `;
        }

        function renderGenericLanding(t) {
            return `
                <img src="${LOGO_URL}" alt="Prompt Studio" class="logo">
                <div class="app-title">Prompt Studio</div>
                <p class="hero-tagline">${t.landing}</p>
                ${renderDownloadButtons(t)}
            `;
        }

        function renderSharedPrompt(data, t) {
            const name = escapeHTML(data.name || 'Untitled Prompt');
            const prompt = escapeHTML(data.prompt || '');
            const lang = data.lang ? escapeHTML(data.lang) : null;

            document.title = `${data.name || 'Shared Prompt'} — Prompt Studio`;

            const langBadge = lang ? `<span class="lang-badge">${lang}</span>` : '';

            return `
                <img src="${LOGO_URL}" alt="Prompt Studio" class="logo">
                <div class="app-title">Prompt Studio</div>
                <div class="template-name"><strong>${name}</strong>${langBadge}</div>

                <div class="prompt-container">
                    <div class="prompt-label">${t.promptLabel}</div>
                    <button class="copy-btn" id="copyBtn" aria-label="${t.copy}">
                        ${clipboardSVG}
                        <span id="copyLabel">${t.copy}</span>
                    </button>
                    <div class="prompt-text" id="promptText">${prompt}</div>
                </div>

                ${renderDownloadButtons(t)}
            `;
        }

        function renderError(t) {
            return `
                <img src="${LOGO_URL}" alt="Prompt Studio" class="logo">
                <div class="app-title">Prompt Studio</div>
                <div class="error-msg">${t.errorMsg}</div>
                ${renderDownloadButtons(t)}
            `;
        }

        function initCopyButton(rawPrompt, t) {
            const btn = document.getElementById('copyBtn');
            if (!btn) return;

            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(rawPrompt);
                } catch {
                    const ta = document.createElement('textarea');
                    ta.value = rawPrompt;
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                btn.classList.add('copied');
                btn.innerHTML = `${checkSVG}<span id="copyLabel">${t.copied}</span>`;
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = `${clipboardSVG}<span id="copyLabel">${t.copy}</span>`;
                }, 2000);
            });
        }

        function updateFooter(t) {
            const el = document.getElementById('footerText');
            if (el) {
                const text = t.footer
                    .replace('{app}', '<strong>Prompt Studio</strong>')
                    .replace('{brand}', '<a href="https://poly-glot-prompt.ai">Poly-Glot</a>');
                el.innerHTML = text;
            }
        }

        function init() {
            const card = document.getElementById('card');
            const hash = window.location.hash.slice(1);

            // Default to English
            let detectedLang = 'EN';
            let t = getLang('EN');

            if (!hash) {
                // Try to detect browser language
                const browserLang = (navigator.language || 'en').toUpperCase().replace('-','_');
                if (L[browserLang]) detectedLang = browserLang;
                else if (L[browserLang.split('_')[0]]) detectedLang = browserLang.split('_')[0];
                t = getLang(detectedLang);

                if (RTL_LANGS.includes(detectedLang)) {
                    document.documentElement.setAttribute('dir', 'rtl');
                    document.documentElement.lang = detectedLang.toLowerCase();
                }

                card.innerHTML = renderGenericLanding(t);
                updateFooter(t);
                return;
            }

            try {
                // Robust base64 decode: handle URL-safe base64 and Unicode
                let b64 = hash;
                // Fix URL-safe base64 chars
                b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
                // Fix padding
                while (b64.length % 4 !== 0) b64 += '=';

                const decoded = decodeURIComponent(escape(atob(b64)));
                const data = JSON.parse(decoded);

                // Detect language from shared data
                if (data.lang) {
                    detectedLang = data.lang.toUpperCase().replace('-','_');
                }
                t = getLang(detectedLang);

                // Set RTL if needed
                if (RTL_LANGS.includes(detectedLang)) {
                    document.documentElement.setAttribute('dir', 'rtl');
                    document.documentElement.lang = detectedLang.toLowerCase();
                }

                if (!data.prompt) {
                    card.innerHTML = renderError(t);
                    updateFooter(t);
                    return;
                }

                card.innerHTML = renderSharedPrompt(data, t);
                initCopyButton(data.prompt, t);
                updateFooter(t);

                // Update OG tags dynamically
                const ogTitle = document.querySelector('meta[property="og:title"]');
                const ogDesc = document.querySelector('meta[property="og:description"]');
                if (ogTitle) ogTitle.content = `${data.name || 'Shared Prompt'} — Prompt Studio`;
                if (ogDesc) ogDesc.content = data.prompt.substring(0, 200) + (data.prompt.length > 200 ? '…' : '');

            } catch (e) {
                console.error('Failed to decode shared prompt:', e);
                card.innerHTML = renderError(t);
                updateFooter(t);
            }
        }

        init();
    </script>
