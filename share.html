<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Studio — Shared Prompt</title>
    <meta property="og:title" content="Prompt Studio — Shared Prompt">
    <meta property="og:description" content="Check out this prompt template shared from Prompt Studio by Poly-Glot. Download the app to use it on iOS and Mac.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://raw.githubusercontent.com/hmoses/poly-glot-site/main/assets/img/icon-128.png">
    <meta name="description" content="A prompt template shared from Prompt Studio by Poly-Glot. Download on iOS and Mac.">
    <link rel="icon" href="https://raw.githubusercontent.com/hmoses/poly-glot-site/main/assets/img/icon-128.png" type="image/png">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            line-height: 1.6;
        }

        .card {
            background-color: #161b22;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 640px;
            width: 100%;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(124, 58, 237, 0.15),
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 80px -20px rgba(124, 58, 237, 0.15);
        }

        .logo {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 16px rgba(124, 58, 237, 0.3));
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .template-name {
            font-size: 16px;
            color: #8b949e;
            margin-bottom: 32px;
        }

        .template-name strong {
            color: #c9d1d9;
            font-weight: 600;
        }

        .lang-badge {
            display: inline-block;
            background: rgba(124, 58, 237, 0.2);
            color: #a78bfa;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 12px;
            margin-left: 8px;
            vertical-align: middle;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .prompt-container {
            position: relative;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            padding-top: 20px;
            margin-bottom: 36px;
            text-align: left;
        }

        .prompt-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
            margin-bottom: 12px;
        }

        .prompt-text {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace;
            font-size: 14px;
            line-height: 1.7;
            color: #e6edf3;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 320px;
            overflow-y: auto;
        }

        .prompt-text::-webkit-scrollbar {
            width: 6px;
        }

        .prompt-text::-webkit-scrollbar-track {
            background: transparent;
        }

        .prompt-text::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 3px;
        }

        .copy-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #8b949e;
            cursor: pointer;
            padding: 6px 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: #30363d;
            color: #e6edf3;
            border-color: #484f58;
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
        }

        .copy-btn.copied {
            color: #3fb950;
            border-color: #238636;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #30363d, transparent);
            margin-bottom: 32px;
        }

        .cta-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .cta-subtitle {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 24px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.45);
        }

        .btn-secondary {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
        }

        .btn-secondary:hover {
            background: #30363d;
            border-color: #484f58;
            transform: translateY(-1px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #484f58;
        }

        .footer a {
            color: #8b949e;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #a78bfa;
        }

        /* Generic landing (no hash) */
        .hero-tagline {
            font-size: 18px;
            color: #8b949e;
            margin-bottom: 32px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Error state */
        .error-msg {
            color: #f85149;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .card {
                padding: 32px 20px;
                border-radius: 16px;
            }

            .logo {
                width: 72px;
                height: 72px;
                border-radius: 18px;
            }

            .app-title {
                font-size: 24px;
            }

            .prompt-text {
                font-size: 13px;
                max-height: 260px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <!-- Content injected by JS -->
    </div>

    <div class="footer">
        Made with <strong>Prompt Studio</strong> by <a href="https://poly-glot.ai">Poly-Glot</a>
    </div>

    <script>
        const IOS_URL = 'https://apps.apple.com/app/id6762054909';
        const MAC_URL = 'https://apps.apple.com/app/id6762222589';
        const LOGO_URL = 'https://raw.githubusercontent.com/hmoses/poly-glot-site/main/assets/img/icon-128.png';

        const clipboardSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        const checkSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
        const iosSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>`;
        const macSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`;

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderDownloadButtons() {
            return `
                <div class="divider"></div>
                <div class="cta-title">Get Prompt Studio</div>
                <div class="cta-subtitle">Create, organize, and share AI prompts on iOS and Mac.</div>
                <div class="buttons">
                    <a href="${IOS_URL}" class="btn btn-primary" target="_blank" rel="noopener">
                        ${iosSVG} Download for iOS
                    </a>
                    <a href="${MAC_URL}" class="btn btn-secondary" target="_blank" rel="noopener">
                        ${macSVG} Download for Mac
                    </a>
                </div>
            `;
        }

        function renderGenericLanding() {
            return `
                <img src="${LOGO_URL}" alt="Prompt Studio" class="logo">
                <div class="app-title">Prompt Studio</div>
                <p class="hero-tagline">Create, organize, and share powerful AI prompt templates — on your iPhone, iPad, and Mac.</p>
                ${renderDownloadButtons()}
            `;
        }

        function renderSharedPrompt(data) {
            const name = escapeHTML(data.name || 'Untitled Prompt');
            const prompt = escapeHTML(data.prompt || '');
            const lang = data.lang ? escapeHTML(data.lang) : null;

            document.title = `${data.name || 'Shared Prompt'} — Prompt Studio`;

            const langBadge = lang ? `<span class="lang-badge">${lang}</span>` : '';

            return `
                <img src="${LOGO_URL}" alt="Prompt Studio" class="logo">
                <div class="app-title">Prompt Studio</div>
                <div class="template-name"><strong>${name}</strong>${langBadge}</div>

                <div class="prompt-container">
                    <div class="prompt-label">Prompt Template</div>
                    <button class="copy-btn" id="copyBtn" aria-label="Copy prompt">
                        ${clipboardSVG}
                        <span id="copyLabel">Copy</span>
                    </button>
                    <div class="prompt-text" id="promptText">${prompt}</div>
                </div>

                ${renderDownloadButtons()}
            `;
        }

        function renderError() {
            return `
                <img src="${LOGO_URL}" alt="Prompt Studio" class="logo">
                <div class="app-title">Prompt Studio</div>
                <div class="error-msg">Could not decode the shared prompt. The link may be invalid or corrupted.</div>
                ${renderDownloadButtons()}
            `;
        }

        function initCopyButton(rawPrompt) {
            const btn = document.getElementById('copyBtn');
            if (!btn) return;

            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(rawPrompt);
                    btn.classList.add('copied');
                    document.getElementById('copyLabel').textContent = 'Copied!';
                    btn.innerHTML = `${checkSVG}<span id="copyLabel">Copied!</span>`;
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = `${clipboardSVG}<span id="copyLabel">Copy</span>`;
                    }, 2000);
                } catch {
                    // Fallback for older browsers
                    const ta = document.createElement('textarea');
                    ta.value = rawPrompt;
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    btn.classList.add('copied');
                    btn.innerHTML = `${checkSVG}<span id="copyLabel">Copied!</span>`;
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = `${clipboardSVG}<span id="copyLabel">Copy</span>`;
                    }, 2000);
                }
            });
        }

        function init() {
            const card = document.getElementById('card');
            const hash = window.location.hash.slice(1);

            if (!hash) {
                card.innerHTML = renderGenericLanding();
                return;
            }

            try {
                const decoded = atob(hash);
                const data = JSON.parse(decoded);

                if (!data.prompt) {
                    card.innerHTML = renderError();
                    return;
                }

                card.innerHTML = renderSharedPrompt(data);
                initCopyButton(data.prompt);

                // Update OG tags dynamically (limited browser support, but good practice)
                const ogTitle = document.querySelector('meta[property="og:title"]');
                const ogDesc = document.querySelector('meta[property="og:description"]');
                if (ogTitle) ogTitle.content = `${data.name || 'Shared Prompt'} — Prompt Studio`;
                if (ogDesc) ogDesc.content = data.prompt.substring(0, 200) + (data.prompt.length > 200 ? '…' : '');

            } catch (e) {
                console.error('Failed to decode shared prompt:', e);
                card.innerHTML = renderError();
            }
        }

        init();
    </script>
</body>
</html>
