name: Full live 38-language localization QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/test_live_full_localization.py
      - .github/workflows/full-live-localization.yml
concurrency:
  group: full-live-localization-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify every locale and secondary page against deployed GitHub Pages
        env:
          PG_SHARD: ${{ matrix.shard }}
        run: python scripts/test_live_full_localization.py
