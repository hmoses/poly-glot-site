name: MCP complete 38-language page audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test_mcp_page_complete.py'
      - 'mcp-integrations.html'
      - 'assets/js/mcp-troubleshooting-locales.js'
      - 'assets/js/mcp-technical-accuracy.js'
      - 'assets/js/claude-guide-locales.js'
      - 'assets/js/mcp-page-localization.js'
      - 'assets/locales/mcp-troubleshooting/**'
      - 'assets/locales/mcp-technical/**'
      - '.github/workflows/mcp-page-full-locale-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify all 38 MCP languages and log missing strings
        run: python scripts/test_mcp_page_complete.py
