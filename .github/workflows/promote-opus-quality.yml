name: Promote guarded OPUS quality candidates
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Review translation quality candidates"]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: opus-quality-catalog-release
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 37865411194
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: quality-*
          merge-multiple: true
          path: quality-candidates
      - name: Validate and promote selected translations
        run: python scripts/promote_opus_quality.py
      - name: Commit reviewed quality improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/locales/subpages/{es,fr,de,it,pt,nl,ru}.json
          if ! git diff --cached --quiet; then
            git commit -m "Improve Spanish French German Italian Portuguese Dutch Russian subpage translations"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
