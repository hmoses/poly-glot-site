name: Deploy to GitHub Pages
# force-publish-2026-10-07T16:05-07:00
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate social preview with official icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/build_og.py
      - name: Verify new social preview exists and is LinkedIn sized
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path("assets/img/polyglot-linkedin-mcp-parrot-2026-v6.png")
          assert path.is_file() and path.stat().st_size > 20_000, "Social preview PNG missing or empty"
          with Image.open(path) as im:
              assert im.format == "PNG" and im.size == (1200, 630), f"Unexpected preview: {im.format} {im.size}"
          print(f"Verified: {path} ({path.stat().st_size:,} bytes)")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
