name: Visual localization screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/locales/subpages/**
      - .github/workflows/localization-visual-audit.yml
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture representative localized pages
        run: |
          python - <<'PY'
          import asyncio,threading,http.server,os
          from pathlib import Path
          from playwright.async_api import async_playwright
          class H(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8869),H)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          Path('localization-visuals').mkdir(exist_ok=True)
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  for width in (390,1280):
                      page=await b.new_page(viewport={'width':width,'height':860},device_scale_factor=1)
                      for code,path in [('NL','connect.html'),('AR','prompt-templates.html'),('JA','terms.html'),('ES','seo-setup.html'),('VI','privacy.html')]:
                          await page.goto('http://127.0.0.1:8869/'+path+'?lang='+code,wait_until='domcontentloaded')
                          await page.wait_for_function('(c)=>Boolean(window._pgSecondaryExact?.[c])',arg=code,timeout=15000)
                          await page.wait_for_timeout(500)
                          if width==390:
                              overflowing=await page.evaluate("""() => Array.from(document.querySelectorAll('*')).filter(el => {let r=el.getBoundingClientRect();return r.width>0 && r.right>window.innerWidth+3 && getComputedStyle(el).position!=='fixed'}).slice(0,12).map(el => ({tag:el.tagName,cls:String(el.className||'').slice(0,70),right:Math.round(el.getBoundingClientRect().right),width:Math.round(el.getBoundingClientRect().width),text:(el.textContent||'').trim().slice(0,45)}))""")
                              if overflowing:print('OVERFLOW',code,path,overflowing,flush=True)
                          await page.screenshot(path='localization-visuals/'+code+'-'+path.replace('.html','')+'-'+str(width)+'.png',full_page=True)
                          audit=await page.evaluate('window._pgSecondaryLocaleAudit')
                          assert audit and not audit['missing'],f'Missing copy in {code} {path}: {audit}'
                      await page.close()
                  await b.close()
          asyncio.run(main())
          server.shutdown()
          PY
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-visuals
          path: localization-visuals/*.png
          if-no-files-found: ignore
