name: MCP troubleshooting localization and parallax browser tests
on:
  push:
    branches: [main]
    paths:
      - 'mcp-integrations.html'
      - 'assets/js/mcp-troubleshooting-locales.js'
      - 'assets/js/section-motion.js'
      - 'assets/locales/mcp-troubleshooting/**'
      - '.github/workflows/test-mcp-troubleshooting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser automation
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify 38 languages, endpoint, preserved cards and parallax
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/mcp-guide-server.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          source='http://127.0.0.1:8765/mcp-integrations.html'
          langs="EN ES FR DE IT PT NL RU ZH ZH_TW JA KO AR HI BN TR PL SV NO DA FI EL HE ID MS TH VI UK CS RO HU SK HR CA AF SW HA AM".split()
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1240,"height":800})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              for lang in langs:
                  page.goto(source+'?lang='+lang,wait_until='domcontentloaded')
                  guide=page.locator('#mcp-troubleshooting')
                  guide.wait_for()
                  page.wait_for_function('''() => {
                     const el=document.getElementById("mcp-troubleshooting");
                     const lang=new URL(location.href).searchParams.get("lang");
                     return el && el.dataset.mcpActiveLanguage === lang &&
                       el.dataset.mcpTranslation === (lang==="EN"?"english":"complete");
                  }''',timeout=19000)
                  assert guide.locator('[data-mcp-tr="title"]').count()==1
                  assert guide.locator('.mcp-client-grid article').count()==6
                  assert guide.locator('.mcp-error-guide details').count()==8
                  assert guide.locator('a[href*="support.claude.com"]').count()==1
                  assert guide.locator('code').count()>=15
                  assert guide.locator('strong').count()>=4
                  assert guide.locator('#pgMcpTroubleEndpoint').inner_text().endswith('/mcp')
                  assert guide.get_attribute('dir')==('rtl' if lang in ('AR','HE') else 'ltr')
                  if lang!='EN':
                      assert 'Troubleshooting Poly-Glot MCP connections, authentication and tools' not in guide.locator('#mcp-troubleshooting-title').inner_text()
                  if lang in ('EN','NL','AR','JA'):
                      assert guide.locator('.mcp-client-grid article.pg-motion-card').count()==6,lang
                      assert guide.locator('.mcp-error-guide details.pg-motion-card').count()==8,lang
                  print('PASS',lang,guide.get_attribute('data-mcp-translation-count'),flush=True)
              # A genuine in-page language switch, not just URL navigation
              page.goto(source+'?lang=EN',wait_until='domcontentloaded')
              page.evaluate("window._pgI18n.setLang('NL','🇳🇱')")
              page.wait_for_function('document.querySelector("#mcp-troubleshooting").dataset.mcpActiveLanguage==="NL"')
              assert page.locator('#mcp-troubleshooting').get_attribute('data-mcp-translation')=='complete'
              page.evaluate("window._pgI18n.setLang('EN','🇺🇸')")
              page.wait_for_function('document.querySelector("#mcp-troubleshooting").dataset.mcpActiveLanguage==="EN"')
              assert 'Troubleshooting Poly-Glot MCP' in page.locator('#mcp-troubleshooting-title').inner_text()
              assert not errors,'Browser JavaScript errors: '+str(errors[:8])
              browser.close()
          PY
