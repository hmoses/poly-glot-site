name: Quick subpage localization smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/locale-smoke.yml
      - assets/js/secondary-page-localization.js
      - assets/js/global-selector-placement.js
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Smoke-test real page localization and show missing labels
        run: |
          python - <<'PY'
          import os,threading,http.server,asyncio,json
          from playwright.async_api import async_playwright
          os.chdir(os.getenv("GITHUB_WORKSPACE","."))
          class H(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          srv=http.server.ThreadingHTTPServer(("127.0.0.1",8671),H)
          threading.Thread(target=srv.serve_forever,daemon=True).start()
          async def run():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=await b.new_page()
                  for code in ["ES","NL","AR"]:
                      for path in ["connect.html","prompt-templates.html","terms.html"]:
                          await page.goto(f"http://127.0.0.1:8671/{path}?lang={code}",wait_until="domcontentloaded")
                          await page.wait_for_function('(code)=>Boolean(window._pgSecondaryExact?.[code])',arg=code,timeout=15000)
                          await page.wait_for_timeout(700)
                          result=await page.evaluate("() => ({lang:window._pgI18n?.curLang?.(),flagCount:window._pgI18n?.LANGS?.length,audit:window._pgSecondaryLocaleAudit,dir:document.documentElement.dir})")
                          a=result['audit'] or {}
                          print(code,path,'missing',len(a.get('missing',[])),'sample',a.get('missing',[])[:12],'flagCount',result['flagCount'],'dir',result['dir'],flush=True)
                          assert result['flagCount']==38 and result['lang']==code, f'Picker mismatch: {code} {path}'
                          assert not a.get('missing',[]), f'Untranslated text on {path} in {code}: {a.get("missing",[])[:15]}'
                          if code=='ES' and path=='prompt-templates.html':
                              title=await page.locator('main h1').inner_text()
                              assert title.startswith('Plantillas de prompts de IA') and 'Pro' in title,title
                              print('Human-edited Spanish guide heading PASSED',flush=True)
                          if code=='NL' and path=='connect.html':
                              await page.evaluate('''() => {window._pgCopied=null;Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:(text)=>{window._pgCopied=text;return Promise.resolve()}}})}''')
                              await page.locator('.code-block .copy-btn').nth(1).click()
                              copied=await page.evaluate('window._pgCopied')
                              assert copied and 'Kopiëren' not in copied and 'Copy' not in copied,copied
                              data=json.loads(copied)
                              assert data['mcpServers']['poly-glot']['url'].endswith('/mcp'),data
                              print('MCP JSON clipboard PASSED in Dutch',flush=True)

                  await page.set_viewport_size({'width':390,'height':844})
                  await page.goto('http://127.0.0.1:8671/prompt-templates.html?lang=AR',wait_until='domcontentloaded')
                  await page.wait_for_function("Boolean(window._pgSecondaryExact?.AR)",timeout=15000)
                  await page.wait_for_timeout(400)
                  cards=await page.locator('main article').evaluate_all("(nodes) => nodes.map(n => ({top:n.getBoundingClientRect().top,bottom:n.getBoundingClientRect().bottom}))")
                  assert len(cards)==4,cards
                  for idx in range(1,len(cards)):
                      assert cards[idx]['top']>=cards[idx-1]['bottom']+8, f'Arabic mobile FAQ cards overlap: {cards}'
                  print('Arabic 390px card spacing PASSED',flush=True)
                  await b.close()
          asyncio.run(run())
          srv.shutdown()
          PY
