name: Privacy Policy — 38-language Analytics Statement
on:
  pull_request:
    paths:
      - 'privacy.html'
      - 'assets/js/privacy-analytics-locales.js'
      - 'scripts/test_privacy_no_prompts_38.js'
      - '.github/workflows/privacy-noprompts-38.yml'
  push:
    branches: [main]
    paths:
      - 'privacy.html'
      - 'assets/js/privacy-analytics-locales.js'
      - 'scripts/test_privacy_no_prompts_38.js'
      - '.github/workflows/privacy-noprompts-38.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact 38-language localized privacy sentence
        run: |
          node --check assets/js/privacy-analytics-locales.js
          node scripts/test_privacy_no_prompts_38.js
