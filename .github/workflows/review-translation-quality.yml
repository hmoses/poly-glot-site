name: Review translation quality candidates
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/review-translation-quality.yml
      - scripts/prepare_opus_quality_candidates.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        code: [ES,FR,DE,IT,PT,NL,RU]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers>=4.42,<5' sentencepiece sacremoses
      - name: Create candidate catalog, never overwrite published strings
        env:
          PG_LOCALE: ${{ matrix.code }}
        run: python scripts/prepare_opus_quality_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.code }}
          path: quality-candidates/*.json
          retention-days: 7
