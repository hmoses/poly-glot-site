name: Probe high-quality translation route for MCP guide
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-mcp-translation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check language translation using public translation endpoint
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request
          text='Troubleshooting Poly-Glot MCP connections, authentication and tools'
          for code in ('ha','am','fr'):
            url='https://translate.googleapis.com/translate_a/single?'+urllib.parse.urlencode({'client':'gtx','sl':'en','tl':code,'dt':'t','q':text})
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=15) as resp:
                data=json.load(resp)
              output=''.join(item[0] for item in data[0] if item and item[0])
              print(code,repr(output[:300]),flush=True)
              assert output.strip() and output.strip()!=text
            except Exception as exc:
              print(code,'FAILED',type(exc).__name__,str(exc)[:200],flush=True)
              raise
          PY
