name: Audit localized technical copy on all product pages
on:
  push:
    branches: [main]
    paths:
      - 'assets/locales/mcp-technical/**'
      - 'assets/js/mcp-technical-accuracy.js'
      - 'connect.html'
      - 'mcp-integrations.html'
      - 'index.html'
      - 'terms.html'
      - 'privacy.html'
      - 'privacy-and-pricing.html'
      - 'compare-ai-tools.html'
      - 'prompt-templates.html'
      - 'multilingual-ai-workspace.html'
      - '.github/workflows/sitewide-technical-i18n.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - group: product
            pages: index.html,terms.html,privacy.html
          - group: mcp
            pages: connect.html,mcp-integrations.html,privacy-and-pricing.html
          - group: knowledge
            pages: compare-ai-tools.html,prompt-templates.html,multilingual-ai-workspace.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify every technical statement in all 38 site languages
        env:
          PG_PAGES: ${{ matrix.pages }}
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/pg-tech-site.log 2>&1 &
          python - <<'PY'
          import json,os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base="http://127.0.0.1:8765/"
          folder=Path("assets/locales/mcp-technical")
          english=json.loads((folder/"en.json").read_text(encoding="utf-8"))["strings"]
          langs="EN ES FR DE IT PT NL RU ZH ZH_TW JA KO AR HI BN TR PL SV NO DA FI EL HE ID MS TH VI UK CS RO HU SK HR CA AF SW HA AM".split()
          pages=os.environ["PG_PAGES"].split(",")
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1280,"height":960},reduced_motion="reduce")
              for lang in langs:
                  catalog=english if lang=="EN" else json.loads((folder/(lang.lower()+".json")).read_text(encoding="utf8"))["strings"]
                  assert set(catalog)==set(english),(lang,"incomplete technical locale")
                  for name in pages:
                      page.goto(base+name+"?lang="+lang,wait_until="domcontentloaded",timeout=25000)
                      try:
                          page.wait_for_function("""lang=>{const d=document.documentElement.dataset;return d.pgTechnicalLanguage===lang&&d.pgTechnicalL10n===(lang==='EN'?'english':'complete')}""",arg=lang,timeout=13000)
                      except Exception:
                          print("FAIL status",name,lang,page.evaluate("""()=>({
                            lang:document.documentElement.dataset.pgTechnicalLanguage,
                            coverage:document.documentElement.dataset.pgTechnicalL10n,
                            count:document.documentElement.dataset.pgTechnicalCount,
                            keys:[...document.querySelectorAll('[data-pg-tech]')].map(x=>x.dataset.pgTech)
                          })"""),flush=True)
                          raise
                      page.wait_for_timeout(150)
                      values=page.locator("[data-pg-tech]").evaluate_all("""els => Object.fromEntries(els.map(e=>[e.dataset.pgTech,e.textContent.trim()]))""")
                      assert values,(name,lang,"missing technical content")
                      for key,actual in values.items():
                          expected=catalog[key]
                          if name=="mcp-integrations.html" and lang!="EN" and key in ("mcpIntro","mcpCount"):
                              assert actual and actual!=english[key],(name,lang,key,"unlocalized fallback")
                              continue
                          got=' '.join(actual.split())
                          want=' '.join(expected.split())
                          if got!=want:
                              print('TECH DIFF',name,lang,key,'actual=',repr(got[:1300]),'expected=',repr(want[:1300]),flush=True)
                              raise AssertionError((name,lang,key,'rendered text differs from reviewed locale catalog'))
                      if lang in ("AR","HE"):
                          assert page.evaluate("document.documentElement.dataset.pgRtl")=="true",(name,lang,"RTL language flag missing")
                      print("PASS",name,lang,len(values),"technical statements",flush=True)
              browser.close()
          PY
