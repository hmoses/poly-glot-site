name: Verify Dutch MCP integrations localization
on:
  push:
    branches: [main]
    paths:
      - 'mcp-integrations.html'
      - 'assets/js/mcp-troubleshooting-locales.js'
      - 'assets/locales/mcp-troubleshooting/nl.json'
      - 'assets/locales/subpages/nl.json'
      - '.github/workflows/test-mcp-dutch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dutch-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test Dutch FAQ, troubleshooting, language switching, endpoint and links
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/polyglot-mcp-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1280,"height":850})
              errors=[]
              page.on('pageerror', lambda e: errors.append(str(e)))
              page.goto('http://127.0.0.1:8765/mcp-integrations.html?lang=NL',wait_until='domcontentloaded')
              page.wait_for_function("""() => {
                  const root=document.querySelector('#mcp-troubleshooting');
                  return root && root.dataset.mcpActiveLanguage==='NL' && root.dataset.mcpTranslation==='complete';
              }""",timeout=20000)
              root=page.locator('#mcp-troubleshooting')
              print('DEBUG',page.evaluate("""() => ({
                 lang:window._pgI18n?.curLang?.(),
                 attrs:{active:document.querySelector('#mcp-troubleshooting')?.dataset.mcpActiveLanguage,
                        count:document.querySelector('#mcp-troubleshooting')?.dataset.mcpTranslationCount},
                 samples:Object.fromEntries(['eyebrow','title','quickTitle','copy'].map(k=>
                     [k,document.querySelector('[data-mcp-tr="'+k+'"]')?.textContent?.trim()])),
                 faq:document.querySelectorAll('main article h2')[2]?.textContent
              })"""),flush=True)
              assert root.locator('#mcp-troubleshooting-title').inner_text().startswith('Problemen met Poly-Glot MCP-verbindingen')
              assert root.locator('[data-mcp-tr="eyebrow"]').inner_text()=='Hulp bij MCP-verbindingen'
              assert root.locator('[data-mcp-tr="quickTitle"]').inner_text()=='Begin met deze vier controles'
              assert root.locator('[data-mcp-tr="copy"]').inner_text()=='Endpoint kopiëren'
              assert root.locator('[data-mcp-tr="clientDocs"]').count()==2
              assert root.locator('.mcp-error-guide details').count()==8
              assert root.locator('[data-mcp-tr="error1Body"]').text_content().startswith('Controleer de volledige')
              assert root.locator('[data-mcp-tr="error8Body"]').text_content().startswith('Roep eerst')
              assert root.locator('[data-mcp-tr="groupLanguage"]').inner_text()=='Taal en audio'
              assert root.locator('#pgMcpTroubleEndpoint').inner_text().endswith('/mcp')
              assert root.locator('code').count()>=15
              assert root.locator('.mcp-client-grid article').count()==6
              assert root.locator('.mcp-client-grid article.pg-motion-card').count()==6
              assert root.locator('.mcp-error-guide details.pg-motion-card').count()==8
              assert root.get_attribute('dir')=='ltr'
              assert page.locator('main article h2').nth(2).inner_text()=='Kan elke AI-assistent verbinding maken met Poly-Glot MCP?'
              assert 'Niet altijd.' in page.locator('main article').nth(2).locator('p').inner_text()
              assert 'Waar vind ik de configuratie-instructies?' in page.locator('main article h2').nth(3).inner_text()
              page.evaluate("window._pgI18n.setLang('EN','🇺🇸')")
              page.wait_for_function("document.querySelector('#mcp-troubleshooting').dataset.mcpActiveLanguage==='EN'")
              assert 'Troubleshooting Poly-Glot' in root.locator('#mcp-troubleshooting-title').inner_text()
              page.evaluate("window._pgI18n.setLang('NL','🇳🇱')")
              page.wait_for_function("document.querySelector('#mcp-troubleshooting').dataset.mcpActiveLanguage==='NL' && document.querySelector('#mcp-troubleshooting').dataset.mcpTranslation==='complete'")
              assert 'Problemen met Poly-Glot' in root.locator('#mcp-troubleshooting-title').inner_text()
              assert not errors,'JavaScript exceptions: '+str(errors[:4])
              print('PASS Dutch MCP guide, FAQ, all 45 keys, 15 identifiers, error guides, Apple-style cards and language switching')
              browser.close()
          PY
