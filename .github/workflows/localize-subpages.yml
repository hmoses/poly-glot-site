name: Generate 38-language secondary-page catalogs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_subpage_locales.py
      - .github/workflows/localize-subpages.yml
permissions:
  contents: write
concurrency:
  group: translate-secondary
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-only translation dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 deep-translator
      - name: Generate static translations for all 37 non-English locales
        run: python scripts/build_subpage_locales.py
      - name: Verify all locale dictionaries exist and have full coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/locales/subpages')
          source=json.loads((p/'en.json').read_text())
          files=list(p.glob('*.json'))
          assert len(source)>50, 'Source extraction incomplete'
          translations=[f for f in files if f.name not in ('en.json','report.json')]
          assert len(translations)==37, f'Expected 37 catalogs: {len(translations)}'
          for path in translations:
              data=json.loads(path.read_text())
              missing=set(source)-set(data)
              assert not missing, f'{path.name}: {len(missing)} untranslated strings'
          print(f'Complete coverage of {len(source)} source strings in 37 translation catalogs')
          PY
      - name: Commit translation catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/locales/subpages
          if ! git diff --cached --quiet; then
            git commit -m "Publish 37 complete static subpage translation catalogs"
            git push
          fi
