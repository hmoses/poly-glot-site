name: Generate 38-language secondary-page catalogs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_subpage_locales.py
      - .github/workflows/localize-subpages.yml
permissions:
  contents: write
concurrency:
  group: subpage-catalogs-${{ github.sha }}
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        code: ["ES","FR","DE","IT","PT","NL","RU","ZH","ZH_TW","JA","KO","AR","HI","BN","TR","PL","SV","NO","DA","FI","EL","HE","ID","MS","TH","VI","UK","CS","RO","HU","SK","HR","CA","AF","SW","HA","AM"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install translation dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 deep-translator
      - name: Generate ${{ matrix.code }} translation catalog
        env:
          PG_ONLY_LOCALE: ${{ matrix.code }}
        run: python scripts/build_subpage_locales.py
      - name: Preserve translated locale catalog
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ matrix.code }}
          path: |
            assets/locales/subpages/en.json
            assets/locales/subpages/${{ matrix.code }}.json
            assets/locales/subpages/${{ matrix.code }}_lowercase.json
            assets/locales/subpages/*.json
          retention-days: 2
  publish:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-*
          path: assets/locales/subpages
          merge-multiple: true
      - name: Verify 37 complete catalogs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('assets/locales/subpages')
          codes=["es","fr","de","it","pt","nl","ru","zh","zh_tw","ja","ko","ar","hi","bn","tr","pl","sv","no","da","fi","el","he","id","ms","th","vi","uk","cs","ro","hu","sk","hr","ca","af","sw","ha","am"]
          src=set(json.loads((root/'en.json').read_text(encoding='utf8')))
          assert len(src)>50, 'The English source was not extracted'
          for code in codes:
              path=root/(code+'.json')
              assert path.is_file(),f'Missing locale: {code}'
              data=json.loads(path.read_text(encoding='utf8'))
              missing=src-set(data)
              assert not missing,f'{code}: missing {len(missing)} translations'
          (root/'report.json').write_text(json.dumps({'languages':38,'source_strings':len(src),'missing':{}},indent=2)+'\n',encoding='utf8')
          print(f'Validated 38 languages and {len(src)} source strings')
          PY
      - name: Commit and publish completed static catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/locales/subpages
          if ! git diff --cached --quiet; then
            git commit -m "Publish 38-language subpage translation catalogs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
