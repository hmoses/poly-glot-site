name: Add MCP listings to product site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-mcp-listings.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Patch product site
        run: python3 .github/scripts/patch-mcp-listings.py
      - name: Commit product site update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add live MCP listings to product site"
          git push
