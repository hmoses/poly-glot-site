name: Verify locale translation service
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/localization-translation-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check deep-translator
      - name: Test independent translation endpoint and batching
        run: |
          python - <<'PY'
          import time
          from deep_translator import GoogleTranslator
          time.sleep(5)
          for code in ('es','nl','ar'):
              start=time.time()
              t=GoogleTranslator(source='en',target=code)
              try:
                  s=t.translate('Connect your AI assistant to Poly-Glot MCP.')
                  time.sleep(1.8)
                  print(code,round(time.time()-start,2),s,flush=True)
              except Exception as e:
                  print('PROBE ERROR',code,repr(e),flush=True)
                  raise
          PY
