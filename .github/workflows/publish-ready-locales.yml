name: Publish per-language localized catalogs safely
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ready-locales.yml
permissions:
  actions: read
  contents: write
concurrency:
  group: release-locales
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve each language artifact using GitHub's supported downloader
        uses: actions/download-artifact@v4
        with:
          run-id: 37864340955
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: offline-catalogs-*
          merge-multiple: false
          path: /tmp/polyglot-language-artifacts
      - name: Select one verified catalog from each artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('assets/locales/subpages')
          root.mkdir(parents=True,exist_ok=True)
          archived=sorted(Path('/tmp/polyglot-language-artifacts').glob('offline-catalogs-*'))
          print('Downloaded artifacts',len(archived),flush=True)
          assert len(archived)>=30,'Too few language artifacts to publish safely'
          refreshed=[]
          source=None
          for folder in archived:
              code=folder.name.removeprefix('offline-catalogs-').lower()
              matches=list(folder.rglob(code+'.json'))
              assert matches,'Missing own catalog in '+folder.name
              value=json.loads(matches[0].read_text(encoding='utf8'))
              assert isinstance(value,dict) and value,'Empty catalog '+code
              (root/(code+'.json')).write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
              if source is None:
                  enfiles=list(folder.rglob('en.json'))
                  assert enfiles,'English catalog not in artifact'
                  source=json.loads(enfiles[0].read_text(encoding='utf8'))
              refreshed.append(code)
          (root/'en.json').write_text(json.dumps(source,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          all_codes=['es','fr','de','it','pt','nl','ru','zh','zh_tw','ja','ko','ar','hi','bn','tr','pl','sv','no','da','fi','el','he','id','ms','th','vi','uk','cs','ro','hu','sk','hr','ca','af','sw','ha','am']
          for code in all_codes:
              file=root/(code+'.json')
              assert file.is_file(),'Missing locale '+code
              values=json.loads(file.read_text(encoding='utf8'))
              missing=set(source)-set(values)
              assert not missing,code+' missing '+str(len(missing))+' entries'
              assert all(isinstance(values[k],str) and values[k].strip() for k in source),code+' has empty values'
          pending=sorted(set(all_codes)-set(refreshed))
          (root/'report.json').write_text(json.dumps({'languages':38,'source_strings':len(source),'missing':{},'model':'M2M100','new_catalogs':refreshed,'pending_model_refresh':pending},ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print('VALIDATED',len(source),'strings,',len(refreshed),'new locales, pending',pending,flush=True)
          PY
      - name: Commit safe release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/locales/subpages
          if ! git diff --cached --quiet; then
            git commit -m "Publish individually verified M2M100 subpage translation catalogs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
