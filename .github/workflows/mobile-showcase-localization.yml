name: Mobile Mac showcase localization regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/js/device-ui-i18n-clean.js
      - index.html
      - scripts/test_home_mobile_localization.py
      - .github/workflows/mobile-showcase-localization.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test French responsive Mac showcase and live language changes
        run: python scripts/test_home_mobile_localization.py
      - name: Archive mobile French screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: french-showcase-mobile-screenshot
          path: mobile-french-localization-check.png
          if-no-files-found: ignore
