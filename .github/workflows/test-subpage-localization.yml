name: Validate 38-language subpages in browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/locales/subpages/**
      - scripts/test_subpage_localization.py
      - seo-setup.html
      - .github/workflows/test-subpage-localization.yml
concurrency:
  group: all-locale-browser-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["EN,ES,FR,DE,IT,PT,NL,RU,ZH,ZH_TW","JA,KO,AR,HI,BN,TR,PL,SV,NO,DA","FI,EL,HE,ID,MS,TH,VI,UK,CS","RO,HU,SK,HR,CA,AF,SW,HA,AM"]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      # Verify all 494 page/language combinations against the published locale catalog source.
      - name: Test localized page and language shard
        env:
          PG_LANG_SHARD: ${{ matrix.shard }}
        run: python scripts/test_subpage_localization.py
      - name: Archive failures and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-browser-report-${{ strategy.job-index }}
          path: localization-browser-report.json
          if-no-files-found: ignore
