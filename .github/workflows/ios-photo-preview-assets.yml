name: Capture and verify iOS Photo to AI product images
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/js/ios-photo-preview-buttons.js'
      - 'assets/js/photo-to-ai-locales.js'
      - 'scripts/capture_photo_to_ai_previews.py'
      - '.github/workflows/ios-photo-preview-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-photo-to-ai-website-preview-assets
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser renderer
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Render iPhone and iPad gallery previews
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/pg-photo-previews.log 2>&1 &
          python scripts/capture_photo_to_ai_previews.py
          for device in iphone ipad; do
            for view in ask photo-to-ai templates how-to-use; do
              test -s "assets/img/screenshots/photo-to-ai-${device}-${view}-preview.png"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: verified-photo-to-ai-iphone-ipad-product-previews
          path: assets/img/screenshots/photo-to-ai-*-preview.png
          if-no-files-found: error
          retention-days: 21
      - name: Publish website preview PNGs only after visual UI tests pass
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/screenshots/photo-to-ai-*-preview.png
          if git diff --cached --quiet; then echo 'Images unchanged'; exit 0; fi
          git commit -m 'Refresh iPhone and iPad Photo to AI website preview images'
          git pull --rebase origin main
          git push origin HEAD:main
