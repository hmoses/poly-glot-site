name: Translate Optional Analytics Privacy Policy (38 languages)
on:
  push:
    branches:
      - feature/optional-posthog-privacy-disclosure-20261011
    paths:
      - privacy.html
      - assets/js/privacy-analytics-exact-locales.js
      - scripts/translate_privacy_analytics.py
      - .github/workflows/translate-privacy-analytics.yml
permissions:
  contents: write
concurrency:
  group: translate-privacy-analytics-${{ github.sha }}
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        code: [ES,FR,DE,IT,PT,NL,RU,ZH,ZH_TW,JA,KO,AR,HI,BN,TR,PL,SV,NO,DA,FI,EL,HE,ID,MS,TH,VI,UK,CS,RO,HU,SK,HR,CA,AF,SW,HA,AM]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 ctranslate2 "transformers>=4.40,<5" sentencepiece "huggingface_hub[hf_xet]" opencc-python-reimplemented
      - name: Translate only newly added policy strings
        env:
          PG_ONLY_LOCALE: ${{ matrix.code }}
        run: python scripts/translate_privacy_analytics.py
      - uses: actions/upload-artifact@v4
        with:
          name: privacy-analytics-${{ matrix.code }}
          path: assets/locales/subpages/*.json
          retention-days: 2
  publish:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/optional-posthog-privacy-disclosure-20261011
      - uses: actions/download-artifact@v4
        with:
          pattern: privacy-analytics-*
          path: assets/locales/subpages
          merge-multiple: true
      - name: Verify 38-language coverage without deleting prior translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          html=BeautifulSoup(Path('privacy.html').read_text(), 'html.parser')
          h=next(h for h in html.find_all('h2') if h.get_text(strip=True)=='Optional In-App Usage Analytics')
          strings=[h.get_text(strip=True)]
          for p in h.find_next_siblings():
              if p.name=='h2':break
              if p.name!='p':continue
              for node in p.descendants:
                  if getattr(node, 'name',None) is None:
                      v=' '.join(str(node).split())
                      if any(ch.isalpha() for ch in v):strings.append(v)
          strings=list(dict.fromkeys(strings))
          root=Path('assets/locales/subpages')
          en=json.loads((root/'en.json').read_text())
          for s in strings:
              if s not in en:en.append(s)
          (root/'en.json').write_text(json.dumps(sorted(set(en)),ensure_ascii=False,indent=2)+'\n')
          languages=['es','fr','de','it','pt','nl','ru','zh','zh_tw','ja','ko','ar','hi','bn','tr','pl','sv','no','da','fi','el','he','id','ms','th','vi','uk','cs','ro','hu','sk','hr','ca','af','sw','ha','am']
          for lang in languages:
              data=json.loads((root/(lang+'.json')).read_text())
              assert all(data.get(key) for key in strings),f'{lang}: missing PostHog policy translation'
          print('PASS: all PostHog policy strings translated in 38 languages (including EN)')
          PY
      - name: Publish new translations without changing other locale keys
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/locales/subpages
          if ! git diff --cached --quiet; then
            git commit -m 'Complete optional analytics privacy policy translations in 38 languages'
            git pull --rebase origin feature/optional-posthog-privacy-disclosure-20261011
            git push origin HEAD:feature/optional-posthog-privacy-disclosure-20261011
          fi
