name: Probe OPUS translation quality
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-opus-quality.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'transformers>=4.42,<5' sentencepiece sacremoses torch
      - run: python scripts/probe_opus_quality.py
